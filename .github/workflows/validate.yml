name: Validate Skills & Agents

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Integrity & Specification Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "mcp<2" -r requirements.txt pytest pydantic

      - name: Pre-commit Secret Scan
        run: python scripts/scan_secrets.py

      - name: Validate Skills & Agents Specifications
        run: python scripts/validate_skills.py

      - name: Run Routing Accuracy Benchmark (25 Cases)
        run: python evals/eval_router.py

      - name: Run Pre-Sync Verification Test Suites
        run: python scripts/sync_to_global.py --test-only
